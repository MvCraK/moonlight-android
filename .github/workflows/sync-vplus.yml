name: Sync Moonlight upstreams
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    if: github.repository == 'MvCraK/moonlight-android' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            upstream: Axixi2233/moonlight-android
          - branch: vplus
            upstream: qiin2333/moonlight-vplus
    concurrency: sync-${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - env:
          BRANCH: ${{ matrix.branch }}
          UPSTREAM: ${{ matrix.upstream }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags "https://github.com/$UPSTREAM.git" refs/heads/master
          source=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$source" HEAD; then exit 0; fi
          if ! git merge --no-ff --no-edit "$source"; then
            git merge --abort
            topic="sync/$BRANCH/$source"
            git push origin "$source:refs/heads/$topic"
            if [ -z "$(gh pr list --base "$BRANCH" --head "$topic" --json number --jq '.[0].number')" ]; then
              gh pr create --base "$BRANCH" --head "$topic" --title "Merge $UPSTREAM into $BRANCH" --body "Resolve upstream conflicts before publishing." || {
                echo "Open the conflict PR: https://github.com/$GITHUB_REPOSITORY/compare/$BRANCH...$topic?expand=1" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              }
            fi
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run personal-release.yml --ref "$BRANCH"
