name: Sync Moonlight upstreams
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.repository == 'MvCraK/moonlight-android' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            upstream: Axixi2233/moonlight-android
          - branch: vplus
            upstream: qiin2333/moonlight-vplus
    concurrency: sync-${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - env:
          BRANCH: ${{ matrix.branch }}
          UPSTREAM: ${{ matrix.upstream }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags "https://github.com/$UPSTREAM.git" refs/heads/master
          source=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$source" HEAD; then exit 0; fi
          if ! git merge --no-ff --no-edit "$source"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            # Upstream commits may carry workflow files that differ from ours, and
            # GITHUB_TOKEN cannot push those, so report the conflict instead of
            # pushing a topic branch.
            {
              echo "### Upstream changes conflict with \`$BRANCH\`"
              echo "Upstream: https://github.com/$UPSTREAM/commit/$source"
              echo
              echo "Conflicted files:"
              echo '```'
              echo "$conflicts"
              echo '```'
              echo "Resolve locally:"
              echo '```bash'
              echo "git checkout $BRANCH && git pull"
              echo "git fetch --no-tags https://github.com/$UPSTREAM.git $source"
              echo "git merge --no-ff --no-edit $source"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream $UPSTREAM@$source conflicts with $BRANCH in: $(echo $conflicts)"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run personal-release.yml --ref "$BRANCH"
