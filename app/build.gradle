apply plugin: 'com.android.application'

def privateModuleProtectionEnabled = gradle.ext.protectPrivateModules &&
        (gradle.ext.hasKishiHaptics || gradle.ext.hasStereo3dAi)

android {
    ndkVersion "27.0.12077973"

    compileSdk 34

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionName "26.11.07"
        versionCode = (project.findProperty("personalVersionCode") ?: "1").toInteger()
        buildConfigField "int", "AXI_CODE", "31"
        buildConfigField "boolean", "HAS_KISHI_HAPTICS", gradle.ext.hasKishiHaptics.toString()
        buildConfigField "boolean", "HAS_STEREO3D_AI", gradle.ext.hasStereo3dAi.toString()
        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        // The optional QNN/HTP stereo backend targets current 64-bit Snapdragon devices.
        // Keep the normal multi-ABI package when the private backend is excluded.
        if (gradle.ext.hasStereo3dAi) {
            ndk.abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.mvcrak.moonlight.axixi.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.mvcrak.moonlight.axixi"
//            applicationId "com.miHoYo.GenshinImpact"
//            applicationId "com.antutu.ABenchMark"
//            applicationId "ru.andr7e.deviceinfohw"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    signingConfigs {
        if (System.getenv("KEYSTORE_PATH")) {
            personalRelease {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "月光"
            resValue "string", "app_label_root", "DR·月光"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.findByName("personalRelease")
//            resValue "string", "app_label", "安兔兔·月光"
            resValue "string", "app_label", "月光·阿西西"
            resValue "string", "app_label_root", "Moonlight (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (privateModuleProtectionEnabled) {
                proguardFile 'proguard-private-protection.pro'
            }
            else {
                proguardFile 'proguard-no-obfuscation.pro'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
}

dependencies {
    implementation project(':optional-haptics-api')
    implementation project(':optional-stereo3d-api')
    if (gradle.ext.hasKishiHaptics) {
        implementation project(':kishi-haptics')
    }
    if (gradle.ext.hasStereo3dAi) {
        implementation project(':stereo3d-ai')
    }
    implementation files('libs/axi_gamepad_1.0.6.aar')
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.5.9'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.github.bumptech.glide:glide:3.8.0'
    implementation 'org.apmem.tools:layouts:1.10@aar'
    testImplementation 'junit:junit:4.13.2'
}

