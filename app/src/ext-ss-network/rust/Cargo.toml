# EXTENSION DEVELOPMENT [EXT-SS-NETWORK] [ADDED]
[package]
name = "ss_network"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
shadowsocks = { version = "=1.24.0", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }
aes = "0.8"
bytes = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
